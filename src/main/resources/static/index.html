<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabLoop</title><link rel="stylesheet" href="style.css"></head><body><aside><div class="brand">◌ LabLoop</div><p>LAB MANAGEMENT</p><button class="nav active" onclick="load()">Dashboard</button><button class="nav" onclick="openAdd()">＋ Add equipment</button><footer>Simple inventory.<br>Clear accountability.</footer></aside><main><header><div><p class="eyebrow">LAB CONTROL CENTER</p><h1>Run your lab<br>with clarity.</h1><p class="sub">Equipment, loans and inspections in one place.</p></div><button onclick="openAdd()">＋ New equipment</button></header><section class="stats"><article><small>ALL ASSETS</small><b id="total">0</b></article><article><small>AVAILABLE NOW</small><b id="available">0</b></article><article><small>ON LOAN</small><b id="borrowed">0</b></article></section><section class="panel"><div class="toolbar"><div><h2>Equipment inventory</h2><small>Manage every asset from one workspace</small></div><input id="search" oninput="render()" placeholder="Search inventory…"><select id="filter" onchange="render()"><option value="ALL">All statuses</option><option>AVAILABLE</option><option>BORROWED</option><option>MAINTENANCE</option><option>RESERVED</option><option>RETIRED</option><option>LOST</option></select></div><div id="list" class="grid"></div></section></main><dialog id="modal"><form method="dialog"><button class="close">×</button><div id="form"></div></form></dialog><script src="app.js"></script></body></html>
