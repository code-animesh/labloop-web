<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LabLoop | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside>
        <div class="brand"><span>◌</span> LabLoop</div>
        <p class="eyebrow">LAB MANAGEMENT</p>
        <nav>
            <button class="nav active" onclick="load()">Dashboard</button>
            <button class="nav" onclick="openForm()">＋ Add equipment</button>
        </nav>
        <footer>Simple inventory.<br>Clear accountability.</footer>
    </aside>
    <main>
        <header>
            <div>
                <p class="eyebrow">LAB CONTROL CENTER</p>
                <h1>Run your lab with clarity.</h1>
                <p class="sub">Equipment, loans, and inspections in one unified workspace.</p>
            </div>
            <button class="primary glow" onclick="openForm()">＋ Add equipment</button>
        </header>

        <section class="stats">
            <article class="stat-card">
                <div class="stat-icon" style="background: #e0f2fe; color: #0284c7;">📊</div>
                <div>
                    <small>ALL ASSETS</small>
                    <b id="total">0</b>
                </div>
            </article>
            <article class="stat-card">
                <div class="stat-icon" style="background: #dcfce7; color: #16a34a;">✓</div>
                <div>
                    <small>AVAILABLE NOW</small>
                    <b id="available">0</b>
                </div>
            </article>
            <article class="stat-card">
                <div class="stat-icon" style="background: #fef9c3; color: #ca8a04;">🔄</div>
                <div>
                    <small>ON LOAN</small>
                    <b id="borrowed">0</b>
                </div>
            </article>
        </section>

        <section class="panel">
            <div class="toolbar">
                <div class="toolbar-title">
                    <h2>Equipment inventory</h2>
                    <small>Manage and track every asset in real-time</small>
                </div>
                <div class="toolbar-actions">
                    <input id="search" oninput="render()" placeholder="🔍 Search assets by name or code...">
                    <select id="filter" onchange="render()">
                        <option value="ALL">All statuses</option>
                        <option value="AVAILABLE">Available</option>
                        <option value="BORROWED">Borrowed</option>
                        <option value="MAINTENANCE">Maintenance</option>
                    </select>
                </div>
            </div>
            <div id="list" class="grid"></div>
        </section>
    </main>

    <dialog id="modal"></dialog>
    <script src="app.js"></script>
</body>
</html>
