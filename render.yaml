services:
  - type: web
    name: labloop-web
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/labloop-web-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: labloop-db, property: connectionString }
databases:
  - name: labloop-db
    databaseName: labloop
    plan: free
